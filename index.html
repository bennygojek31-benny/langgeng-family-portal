<!DOCTYPE html>
<html lang="id">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Langgeng Family Mojokerto - Portal Resmi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;min-height:100vh}
.header{text-align:center;padding:30px 20px 10px}
#logoAdmin{width:180px;height:180px;border-radius:12px;border:3px solid #d4a44a;object-fit:cover;box-shadow:0 0 30px rgba(212,164,74,.3);cursor:pointer;transition:.2s}
#logoAdmin:active{transform:scale(.95)}
.title{color:#d4a44a;font-size:28px;font-weight:800;letter-spacing:2px;margin:15px 0 5px}
.subtitle{color:#888;font-size:13px;letter-spacing:3px}
.sync{color:#4ade80;font-size:13px;margin:15px 0;background:#0a1a0a;border:1px solid #1a3a1a;padding:8px 15px;border-radius:20px;display:inline-block}
.container{max-width:480px;margin:0 auto;padding:0 20px 30px}
.card{background:#0f0f0f;border:1px solid #222;border-radius:16px;padding:20px;margin:15px 0}
.card-title{color:#d4a44a;font-weight:700;margin-bottom:15px;font-size:16px;display:flex;align-items:center;gap:8px}
.input{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin:7px 0;font-size:14px}
.input:focus{outline:none;border-color:#d4a44a}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;transition:.2s}
.btn-gold{background:#d4a44a;color:#000}
.btn-gold:active{transform:scale(.98)}
.btn-dark{background:#222;color:#fff;border:1px solid #333}
.info-card{background:#111;border:1px solid #1a1a1a;border-radius:12px;padding:12px 15px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.info-label{color:#888;font-size:12px}
.info-value{color:#fff;font-weight:600;font-size:13px}
.info-wa{color:#4ade80;font-size:12px;text-decoration:none}
.hidden{display:none !important}
#clickHint{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#d4a44a;color:#000;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:99;display:none;box-shadow:0 4px 15px rgba(0,0,0,.5)}
.kta-card{background:linear-gradient(135deg,#1a1a1a,#0f0f0f);border:1px solid #d4a44a;border-radius:14px;padding:15px;margin:10px 0;position:relative;overflow:hidden}
.kta-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#d4a44a,#8a6a2a)}
.badge{background:#d4a44a;color:#000;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}
</style>
</head>
